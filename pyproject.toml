[project]
name = "er"
version = "0.1.0"
description = "Business entity resolution: scorer, normalization, blocking"
requires-python = ">=3.12,<3.13"
dependencies = [
    "polars>=1.30",
    "pyarrow>=18",
    "numpy>=2.0",
    "scipy>=1.14",
    "scikit-learn>=1.6",
    "sparse-dot-topn>=1.1",
    "rapidfuzz>=3.10",
    "anyascii>=0.3.2",
    "jellyfish>=1.1",
    "psutil>=6.0",
    "lightgbm>=4.5",
    "matplotlib>=3.9",
    "xgboost>=2.1",
    "optuna>=5.0.0",
]

[project.optional-dependencies]
dense = ["torch>=2.7", "sentence-transformers>=3.3", "datasets>=3.0", "accelerate>=1.0"]
tune = ["optuna>=4.0", "catboost>=1.2"]

[project.scripts]
er = "er.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/er"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
