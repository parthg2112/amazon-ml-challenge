# Every channel once, to measure standalone quality and unique contribution.
name = "all_v1"
subset = "dev"
budgets = [10, 20, 30, 50]

[norm]
translit = true
profile_mode = "auto"

[[channels]]
id = "B1_name_sorted"
type = "exact"
query_col = "name_sorted"

[[channels]]
id = "B1_name_concat"
type = "exact"
query_col = "name_concat"

[[channels]]
id = "B1_name_fold"
type = "exact"
query_col = "name_fold"

[[channels]]
id = "B1_house_token"
type = "house_token"
rarest = 2

[[channels]]
id = "B2_name_word"
type = "sparse"
k = 50
fields = [{ col = "name_core", analyzer = "word", ngram = [1, 1] }]

[[channels]]
id = "B3_name_char"
type = "sparse"
k = 50
fields = [{ col = "name_core", ngram = [3, 3] }]

[[channels]]
id = "B4_addr_char"
type = "sparse"
k = 50
fields = [{ col = "addr_norm", ngram = [3, 3] }]

[[channels]]
id = "B5_name_addr"
type = "sparse"
k = 50
fields = [{ col = "name_core", ngram = [3, 3], weight = 1.0 }, { col = "addr_norm", ngram = [3, 3], weight = 1.0 }]
