# v7b_n5b5: v7a + B5 uses name_min instead of name_core.
name = "v7b_n5b5"
subset = "dev"
budgets = [5, 10, 15, 20, 30, 50]

[norm]
learned = "configs/learned/n4_v1.json"

[ranker]
enabled = true
train_subset = "rtrain10"
neg_rate = 0.2
model = "lgbm_rank"
precut = 20

[[channels]]
id = "B1_name_concat"
type = "exact"
query_col = "name_concat"

[[channels]]
id = "B1_name_fold"
type = "exact"
query_col = "name_fold"

[[channels]]
id = "B1_house_token"
type = "house_token"
rarest = 2

[[channels]]
id = "B2_name_word"
type = "sparse"
k = 50
fields = [{ col = "name_core", analyzer = "word", ngram = [1, 1] }]

[[channels]]
id = "B4_addr_char"
type = "sparse"
k = 50
partition = "addr_region"
fields = [{ col = "addr_norm", ngram = [3, 3] }]

[[channels]]
id = "B5_name_addr"
type = "sparse"
k = 50
partition = "addr_region"
fields = [{ col = "name_min", ngram = [3, 3] }, { col = "addr_norm", ngram = [3, 3] }]

[[channels]]
id = "B7_dense"
type = "dense"
k = 50

[[channels]]
id = "B1_name_min"
type = "exact"
query_col = "name_min_key"
